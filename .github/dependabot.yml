version: 2
updates:
  # ── npm dependencies ──
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # The Expo SDK manages versions for `expo`, every `expo-*` module, React
    # Native, and the SDK-aligned native libraries as a coordinated set - their
    # versions must move together via `npx expo install` / `expo install --fix`
    # during a deliberate SDK upgrade. A piecemeal Dependabot bump (e.g. an
    # SDK-56 module against an SDK-55 core) produces an unsupported combination
    # that breaks the native build, and CI's pure-JS tests won't catch it. So
    # ignore this whole stack entirely; everything else stays managed.
    # (Security advisories still surface via Dependabot security alerts.)
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "babel-preset-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native-community/*"
      # Known-broken majors (minor/patch still flow). Revisit when the
      # blocker clears - otherwise the grouped npm-major PR re-opens weekly:
      #   eslint 10   - eslint-plugin-react (via eslint-config-expo) caps its
      #                 peer at ^9.7 and crashes on v10.
      #   typescript 7 - ts-jest peer is <7 and Expo tooling wants ^5.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Group everything into at most two PRs so a first run can't flood the repo:
    # one low-risk PR (minor/patch, safe to merge in bulk) and one major-bump PR
    # (review-and-merge deliberately). `patterns: ["*"]` makes each group catch
    # all remaining dependencies.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
      npm-major:
        patterns: ["*"]
        update-types:
          - major

  # ── GitHub Actions used by the workflows ──
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Single grouped PR across all action updates (major included - actions
    # majors are low-risk and few).
    groups:
      actions:
        patterns: ["*"]
