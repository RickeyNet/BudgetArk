name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly re-scan so newly-disclosed advisories surface against deps that
    # haven't changed (Mondays 06:42 UTC).
    - cron: "42 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── SCA: known-vulnerable dependency check ──
  npm-audit:
    name: npm audit (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate on high/critical only - moderate/low advisories in transitive
      # build tooling are often unactionable and would block every PR.
      # scripts/audit-gate.mjs wraps `npm audit --json` and additionally
      # tolerates the advisories pinned in .npm-audit-allowlist.json (high+
      # findings with no patched release yet; each entry carries a reason and
      # an expiry date after which the gate fails again). Anything else at
      # high/critical still fails. Run `npm audit` locally to triage the
      # full list, `npm run audit:gate` to see exactly what CI sees.
      - name: Audit dependencies (high+, allowlist-aware)
        run: npm run audit:gate

  # ── SCA: block PRs that introduce vulnerable / disallowed-license deps ──
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write # post the review summary as a PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── Secret scanning (gitleaks, license-free binary) ──
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0 # full history so secrets in past commits are caught

      - name: Run gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
