name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege default; jobs read code only.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate: the codebase is clean at 0 tsc errors (strict mode).
      - name: Typecheck
        run: npm run typecheck

      # Hard gate. Serial run (--runInBand): the sync tests bind real TCP
      # sockets / zeroconf and race on ports when run in parallel workers.
      - name: Test
        run: npm run test:ci -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  expo-doctor:
    name: Expo Doctor (advisory)
    runs-on: ubuntu-latest
    # Dependency-health check; informative, not a merge blocker.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run expo-doctor
        run: npx --yes expo-doctor
