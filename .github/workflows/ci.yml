name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege default; jobs read code only.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate: the codebase is clean at 0 tsc errors (strict mode).
      - name: Typecheck
        run: npm run typecheck

      # Hard gate. Serial run (--runInBand): the sync tests bind real TCP
      # sockets / zeroconf and race on ports when run in parallel workers.
      # Coverage is enforced via coverageThreshold in jest.config.js.
      - name: Test
        run: npm run test:ci -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate on errors only; warnings surface in the log without blocking.
      - name: Lint
        run: npm run lint

  bundle:
    name: Bundle (Metro export smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches what tsc/jest can't: Metro resolution failures, bad asset
      # references, babel/metro config breakage — the class of error that
      # previously shipped as a broken OTA bundle (see b34958f).
      - name: Export JS bundles
        run: npx expo export --platform ios --platform android
        env:
          EXPO_NO_TELEMETRY: "1"

  expo-doctor:
    name: Expo Doctor (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dependency-health check; informative, not a merge blocker.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run expo-doctor
        run: npx --yes expo-doctor
